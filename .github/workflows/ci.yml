# Three platforms, three TeX setups, both backends:
#
#  * Linux — apt libkpathsea-dev: the LINKED in-process backend (plus a
#    forced-unlinked run so the subprocess backend stays covered on the
#    platform where development happens).
#  * macOS — BasicTeX: ships NO libkpathsea at all (no header, no dylib,
#    no .pc) — the motivating scenario for the subprocess backend.
#  * Windows — TeX Live: no pkg-config, no library; exercises the
#    subprocess backend's Windows path semantics (`;` path-list
#    separator, drive-letter paths, .exe lookup through PATHEXT).
#
# Tests deliberately run with cargo's default parallelism — the old
# Travis config needed RUST_TEST_THREADS=1 to dodge the concurrent
# Kpaths::new() crash that is now fixed (and regression-tested).
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (linked + forced-unlinked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install TeX Live + libkpathsea
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libkpathsea-dev texlive-latex-base
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (in-process backend, linked)
        run: cargo test
      - name: Test (subprocess backend, forced-unlinked)
        run: cargo test
        env:
          PKG_CONFIG_LIBDIR: /nonexistent
          CARGO_TARGET_DIR: target-unlinked

  macos:
    name: macOS (BasicTeX, subprocess backend)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install BasicTeX (no libkpathsea by design)
        run: |
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (must fall back to the subprocess backend)
        run: |
          kpsewhich --version
          cargo build 2>&1 | tee build.log
          grep -q "building without linking" build.log
      - name: Test
        run: cargo test

  windows:
    name: Windows (TeX Live, subprocess backend)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install TeX Live (scheme-basic)
        uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: scheme-basic
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (must fall back to the subprocess backend)
        shell: bash
        run: |
          kpsewhich --version
          cargo build 2>&1 | tee build.log
          grep -q "building without linking" build.log
      # kpathsea crate only: kpathsea_sys's bindings.rs is bindgen output
      # from Linux/glibc headers, and its layout self-tests assert glibc
      # struct layouts — meaningless where we never link, and genuinely
      # different under MSVC's LLP64.
      - name: Test (kpathsea crate)
        run: cargo test -p kpathsea

  # EXPERIMENTAL, allowed to fail: can we dynamically link libkpathsea on
  # Windows? TeX Live's Windows distribution builds its binaries against a
  # shared kpathsea DLL (bin/windows/kpathsea*.dll) but ships no headers
  # and no import library. This job inventories the DLL's exports,
  # synthesizes an import library (dumpbin -exports → .def → lib.exe),
  # and smoke-links a minimal program against the OPAQUE-POINTER API only
  # (kpathsea_new / set_program_name / find_file) — struct-field access
  # is off the table until bindings are regenerated for MSVC (the
  # Linux-generated layout assertions demonstrably do not hold there).
  windows-dll-probe:
    name: Windows (experimental TL-DLL in-process probe)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install TeX Live (scheme-basic)
        uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: scheme-basic
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Inventory kpathsea DLLs and exports
        shell: bash
        run: |
          BIN="$(dirname "$(command -v kpsewhich)")"
          echo "TeX bin dir: $BIN"
          ls -la "$BIN"/*.dll 2>/dev/null || echo "NO DLLs found in $BIN"
          for dll in "$BIN"/*kpathsea*.dll; do
            [ -e "$dll" ] || continue
            echo "=== exports of $dll (kpse_/kpathsea_ symbols) ==="
            dumpbin -exports "$dll" | grep -Ec "kpathsea_|kpse_" || true
            dumpbin -exports "$dll" | grep -E "kpathsea_(new|set_program_name|find_file|finish)" || true
          done
      - name: Synthesize import library and smoke-link the opaque API
        shell: bash
        run: |
          BIN="$(dirname "$(command -v kpsewhich)")"
          DLL=$(ls "$BIN"/*kpathsea*.dll 2>/dev/null | head -1)
          if [ -z "$DLL" ]; then echo "no kpathsea DLL — nothing to probe"; exit 1; fi
          NAME="$(basename "$DLL" .dll)"
          # Export table → module-definition file → import library.
          { echo "LIBRARY $NAME"
            echo "EXPORTS"
            dumpbin -exports "$DLL" | awk '$1 ~ /^[0-9]+$/ && NF >= 4 { print "  " $4 }'
          } > "$NAME.def"
          wc -l "$NAME.def"
          lib -nologo -def:"$NAME.def" -out:"$NAME.lib" -machine:x64
          echo "KPSE_DLL_NAME=$NAME" >> "$GITHUB_ENV"
          cat > smoke.rs <<'RS'
          use std::ffi::{CStr, CString};
          use std::os::raw::{c_char, c_int, c_uint, c_void};
          unsafe extern "C" {
            fn kpathsea_new() -> *mut c_void;
            fn kpathsea_set_program_name(k: *mut c_void, argv0: *const c_char, prog: *const c_char);
            fn kpathsea_find_file(k: *mut c_void, name: *const c_char, fmt: c_uint, must_exist: c_int) -> *mut c_char;
            fn kpathsea_finish(k: *mut c_void);
          }
          fn main() {
            unsafe {
              let kpse = kpathsea_new();
              assert!(!kpse.is_null(), "kpathsea_new returned NULL");
              let prog = CString::new("kpsewhich").unwrap();
              kpathsea_set_program_name(kpse, prog.as_ptr(), prog.as_ptr());
              let name = CString::new("article.cls").unwrap();
              // 26 = kpse_tex_format (stable position in kpse_file_format_type)
              let found = kpathsea_find_file(kpse, name.as_ptr(), 26, 1);
              assert!(!found.is_null(), "kpathsea_find_file found nothing");
              println!("IN-PROCESS FOUND: {}", CStr::from_ptr(found).to_string_lossy());
              kpathsea_finish(kpse);
            }
          }
          RS
      # pwsh, not bash: under Git Bash, rustc resolves `link` to GNU
      # coreutils' /usr/bin/link instead of MSVC's link.exe.
      - name: Smoke-run the opaque API
        shell: pwsh
        run: |
          rustc -O smoke.rs -L . -l $env:KPSE_DLL_NAME -o smoke.exe
          ./smoke.exe
